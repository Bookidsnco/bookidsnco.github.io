<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bookids</title>
	<link rel="icon" type="image/png" sizes="196x196" href="../../assets/images/icons/favicon-196.png">
	<!-- 예전 주소(/apps/Bookids/)는 첫 화면으로 보내서 언어에 맞는 페이지가 열리게 함 (?mode= 같은 쿼리도 그대로 넘김).
	     파일로 직접 열면(file://) 폴더 주소가 index.html 을 열어 주지 않으므로 파일 이름까지 붙임 -->
	<script>location.replace('../../' + (location.protocol === 'file:' ? 'index.html' : '') + location.search + location.hash);</script>
	<!-- 스크립트가 꺼진 경우에만. noscript 밖에 두면 브라우저에 따라 이 이동이 위 스크립트의 이동을 덮어써서 ?mode= 가 사라질 수 있음 -->
	<noscript><meta http-equiv="refresh" content="0; url=../../"></noscript>
</head>
<body>
	<a href="../../">부키즈 소개 페이지로 이동</a>
</body>
</html>
